name: SMAXOF1 Cloud Market Simulation

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-simulation-main
  cancel-in-progress: false

jobs:
  update-market-state:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update transparent market state
        run: python market_cron.py

      - name: Commit updated market state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_state.json
          if git diff --cached --quiet; then
            echo "No market state change to commit."
          else
            git commit -m "🤖 Cloud Cron: Update SMAXOF1 market price"
            git push origin HEAD:main
          fi
