name: SMAXOF1 Cloud Market Simulation

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: market-simulation-main
  cancel-in-progress: false

jobs:
  update-market-state:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Update transparent market state
        run: python market_cron.py

      - name: Commit updated market state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_state.json incident_state.json epos/sales_history.json
          if git diff --cached --quiet; then
            echo "No market state change to commit."
          else
            git commit -m "🤖 Cloud Cron: Update SMAXOF1 market price"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage current market and incident state for Pages
        run: |
          cp market_state.json frontend/market_state.json
          cp incident_state.json frontend/incident_state.json
          rm -rf frontend/epos
          cp -R epos frontend/epos

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy frontend to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
